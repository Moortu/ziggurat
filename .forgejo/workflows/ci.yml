# NOTE: this workflow has not run yet. The repository has no remote, so no
# runner has ever executed it. Treat it as untested until it is pushed.
#
# Syntax is Forgejo Actions (Codeberg). `runs-on: docker` selects a generic
# Docker runner; Codeberg also offers `codeberg-tiny`. We use `docker`.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: docker
    env:
      ZIG_VERSION: "0.17.0"
      # Zig's published minisign public key.
      ZIG_MINISIGN_KEY: "RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install minisign and archive tools
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo_cmd=""; [ "$(id -u)" -ne 0 ] && sudo_cmd="sudo"
            $sudo_cmd apt-get update
            $sudo_cmd apt-get install -y minisign xz-utils curl
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache minisign xz curl
          else
            echo "No supported package manager found for minisign" >&2
            exit 1
          fi

      - name: Download and verify Zig
        run: |
          set -eu
          file="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSLO "https://ziglang.org/download/${ZIG_VERSION}/${file}"
          curl -fsSLO "https://ziglang.org/download/${ZIG_VERSION}/${file}.minisig"
          minisign -Vm "$file" -P "$ZIG_MINISIGN_KEY" || {
            echo "minisign verification of $file failed" >&2
            exit 1
          }
          mkdir -p "$HOME/zig"
          tar -xJf "$file" -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - name: Show Zig version
        run: zig version

      - name: Test
        run: zig build test

      - name: Cross-compile check
        run: zig build cross
