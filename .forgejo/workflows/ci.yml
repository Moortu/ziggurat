# NOTE: this workflow has not run yet. The repository has no remote, so no
# runner has ever executed it. Treat it as untested until it is pushed.
#
# Syntax is Forgejo Actions (Codeberg). `runs-on: docker` selects a generic
# Docker runner; Codeberg also offers `codeberg-tiny`. We use `docker`.
# Check at the first push that a runner with the label `docker` exists;
# hosted runners may only advertise `codeberg-*` labels.
#
# The Godot steps (download, checksum, headless libraries, `-Dgodot-path`)
# are new in Stage 2 and equally untested: the Godot binary may need more
# shared libraries on a bare runner image than the list installed below.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: docker
    env:
      ZIG_VERSION: "0.17.0"
      # Zig's published minisign public key.
      ZIG_MINISIGN_KEY: "RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U"
      GODOT_VERSION: "4.7.2-stable"
      GODOT_ZIP: "Godot_v4.7.2-stable_linux.x86_64.zip"
      # From SHA512-SUMS.txt of the official 4.7.2-stable release
      # (github.com/godotengine/godot/releases/tag/4.7.2-stable).
      GODOT_SHA512: "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install minisign and archive tools
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo_cmd=""; [ "$(id -u)" -ne 0 ] && sudo_cmd="sudo"
            $sudo_cmd apt-get update
            $sudo_cmd apt-get install -y minisign xz-utils curl unzip \
              libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1 libasound2 libfontconfig1
          else
            # The official Godot build links against glibc, so a musl image
            # (Alpine) cannot run the Godot tests.
            echo "This job needs a Debian or Ubuntu runner image (apt-get); the official Godot build needs glibc." >&2
            exit 1
          fi

      - name: Download and verify Zig
        run: |
          set -eu
          file="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSLO "https://ziglang.org/download/${ZIG_VERSION}/${file}"
          curl -fsSLO "https://ziglang.org/download/${ZIG_VERSION}/${file}.minisig"
          minisign -Vm "$file" -P "$ZIG_MINISIGN_KEY" || {
            echo "minisign verification of $file failed" >&2
            exit 1
          }
          # Outside root's home, so the non-root test user can run it.
          if [ "$(id -u)" -eq 0 ]; then zig_dir=/opt/zig; else zig_dir="$HOME/zig"; fi
          mkdir -p "$zig_dir"
          tar -xJf "$file" -C "$zig_dir" --strip-components=1
          echo "$zig_dir" >> "$GITHUB_PATH"

      - name: Download and verify Godot
        run: |
          set -eu
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_ZIP}"
          echo "${GODOT_SHA512}  ${GODOT_ZIP}" | sha512sum -c - || {
            echo "sha512 check of ${GODOT_ZIP} failed" >&2
            exit 1
          }
          # Outside root's home, so the non-root test user can run it.
          if [ "$(id -u)" -eq 0 ]; then godot_dir=/opt/godot; else godot_dir="$HOME/godot"; fi
          mkdir -p "$godot_dir"
          unzip -o -q "$GODOT_ZIP" -d "$godot_dir"
          chmod 755 "$godot_dir/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "GODOT_BIN=$godot_dir/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Show Zig version
        run: zig version

      - name: Check formatting
        run: zig fmt --check src test sdk tools build.zig

      # Container jobs usually run as root, and the read-only project tests
      # skip as root (root ignores file modes). Run the tests as a normal user
      # so they run.
      - name: Create a non-root test user
        run: |
          set -eu
          if [ "$(id -u)" -eq 0 ]; then
            useradd -m ziguser
            chown -R ziguser "$PWD"
          fi

      - name: Test
        run: |
          set -eu
          if [ "$(id -u)" -eq 0 ]; then
            su -s /bin/sh ziguser -c "cd '$PWD' && PATH='$PATH' zig build test --summary all -Dgodot-path='$GODOT_BIN'"
          else
            zig build test --summary all -Dgodot-path="$GODOT_BIN"
          fi

      - name: Cross-compile check
        run: zig build cross
